name: Build AiMomo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Cek Kelengkapan File Wajib
        run: |
          for f in package.json capacitor.config.json www/index.html; do
            if [ ! -f "$f" ]; then
              echo "ERROR: File $f belum dibuat di repositori!"
              exit 1
            fi
          done
          echo "Semua file wajib ditemukan!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install & Siapkan Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Tambah Izin Kamera & Mikrofon
        run: |
          node << 'EOF'
          const fs = require('fs');
          const p = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(p, 'utf8');
          const perms = [
            '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
            '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
            '<uses-permission android:name="android.permission.CAMERA" />'
          ].join('\n    ');
          if (!xml.includes('RECORD_AUDIO')) {
            xml = xml.replace('<application', perms + '\n    <application');
            fs.writeFileSync(p, xml);
          }
          EOF

      - name: Compile APK Android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload File APK AiMomo
        uses: actions/upload-artifact@v4
        with:
          name: AiMomo-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
